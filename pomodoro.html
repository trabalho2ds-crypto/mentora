    <main>

        <section class="pomodoro">

            <h2>Temporizador Pomodoro</h2>

                25:00
            </div>


            <div class="botoes-pomodoro">

                <button id="btn-start">
                    Iniciar
                </button>

                <button id="btn-pause">
                    Pausar
                </button>

                <button id="btn-reset">
                    Resetar
                </button>

                    Pausa (5 min)
                </button>

            </div>

        </section>
